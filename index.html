<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Maintenance - Ultimate Cyberpunk</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        cyber: ['Orbitron', 'sans-serif'],
                    },
                    colors: {
                        neon: {
                            cyan: '#00f3ff',
                            pink: '#ff00ea',
                            purple: '#bc13fe',
                            blue: '#0b3954'
                        }
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
        body, html {
            margin: 0; padding: 0; overflow: hidden; height: 100%;
            background-color: #050505;
            transition: background-color 0.5s ease;
        }
        html:not(.dark) body {
            background-color: #f0f4f8;
        }

        /* Canvas Background */
        #particle-canvas {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0;
            pointer-events: auto; /* Allow mouse interaction */
        }

        /* 3D Tilt Container & Glass Card */
        .tilt-container {
            perspective: 1500px;
            z-index: 10;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
            padding: 1rem;
            pointer-events: none; /* Let canvas get mousemove, we track document */
        }
        .glass-card {
            position: relative;
            background: rgba(10, 10, 15, 0.4);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(0, 243, 255, 0.3);
            box-shadow: 0 20px 50px rgba(0,0,0,0.5), inset 0 0 0 1px rgba(255,255,255,0.1);
            transform-style: preserve-3d;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
            pointer-events: auto; /* Re-enable pointer events for card */
            will-change: transform;
        }
        html:not(.dark) .glass-card {
            background: rgba(255, 255, 255, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 20px 50px rgba(31, 38, 135, 0.15), inset 0 0 0 1px rgba(255,255,255,0.5);
        }
        
        /* Inner glare effect for tilt */
        .glare {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 50%, rgba(255,255,255,0.2) 0%, transparent 50%);
            opacity: 0;
            pointer-events: none;
            border-radius: inherit;
            transition: opacity 0.3s ease;
            transform: translateZ(1px); /* Keep slightly above background */
        }

        /* Ultimate Glitch Text */
        .glitch-wrapper {
            position: relative;
            transform: translateZ(30px); /* Pop out in 3D */
        }
        .glitch-text {
            position: relative;
            color: #fff;
            font-weight: 900;
            text-transform: uppercase;
            text-shadow: 0 0 15px rgba(0, 243, 255, 0.5);
        }
        html:not(.dark) .glitch-text {
            color: #111;
            text-shadow: 2px 2px 0px rgba(0,0,0,0.1);
        }
        .dark .glitch-text::before, .dark .glitch-text::after {
            content: attr(data-text);
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
        }
        .dark .glitch-text::before {
            left: 3px;
            text-shadow: -2px 0 var(--neon-pink);
            clip: rect(24px, 999px, 90px, 0);
            animation: glitch-anim-1 2.5s infinite linear alternate-reverse;
        }
        .dark .glitch-text::after {
            left: -3px;
            text-shadow: 2px 0 var(--neon-cyan);
            clip: rect(85px, 999px, 140px, 0);
            animation: glitch-anim-2 3s infinite linear alternate-reverse;
        }
        @keyframes glitch-anim-1 {
            0% { clip: rect(15px, 9999px, 44px, 0); }
            20% { clip: rect(85px, 9999px, 59px, 0); }
            40% { clip: rect(32px, 9999px, 98px, 0); }
            60% { clip: rect(78px, 9999px, 23px, 0); }
            80% { clip: rect(12px, 9999px, 85px, 0); }
            100% { clip: rect(59px, 9999px, 12px, 0); }
        }
        @keyframes glitch-anim-2 {
            0% { clip: rect(65px, 9999px, 100px, 0); }
            20% { clip: rect(12px, 9999px, 59px, 0); }
            40% { clip: rect(85px, 9999px, 23px, 0); }
            60% { clip: rect(32px, 9999px, 98px, 0); }
            80% { clip: rect(59px, 9999px, 12px, 0); }
            100% { clip: rect(10px, 9999px, 44px, 0); }
        }

        /* 3D Elements Inside Card */
        .content-3d {
            transform: translateZ(20px);
        }
        .btn-3d {
            transform: translateZ(40px);
        }

        /* Cyberpunk Button */
        .btn-cyber {
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.1);
        }
        .btn-cyber.active {
            box-shadow: 0 0 20px var(--neon-cyan), inset 0 0 10px var(--neon-cyan);
            border-color: var(--neon-cyan);
            animation: neon-pulse 1.5s infinite alternate;
        }
        .btn-cyber.active::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            transition: all 0.5s ease;
        }
        .btn-cyber.active:hover::before {
            left: 100%;
        }
        @keyframes neon-pulse {
            0% { box-shadow: 0 0 10px var(--neon-cyan), inset 0 0 5px var(--neon-cyan); }
            100% { box-shadow: 0 0 30px var(--neon-cyan), inset 0 0 15px var(--neon-cyan); }
        }

        /* Overlay */
        #success-overlay {
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
            backdrop-filter: blur(30px);
        }
        #success-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }
    </style>
</head>
<body class="text-gray-800 dark:text-gray-200 font-sans selection:bg-neon-pink selection:text-white">

    <!-- Interactive Particle Background -->
    <canvas id="particle-canvas"></canvas>

    <!-- Theme Toggle -->
    <button id="theme-toggle" class="absolute top-6 right-6 z-50 p-3 rounded-full bg-white/10 dark:bg-black/40 backdrop-blur-md border border-white/20 dark:border-neon-cyan/30 hover:scale-110 hover:shadow-[0_0_15px_rgba(0,243,255,0.5)] transition-all duration-300">
        <svg id="sun-icon" class="w-6 h-6 hidden text-amber-400 drop-shadow-[0_0_5px_rgba(251,191,36,0.8)]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
        <svg id="moon-icon" class="w-6 h-6 text-neon-cyan drop-shadow-[0_0_5px_rgba(0,243,255,0.8)]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
    </button>

    <!-- 3D Tilt Wrapper -->
    <div class="tilt-container">
        <!-- Main Glass Card -->
        <div id="tilt-card" class="glass-card w-full max-w-xl p-10 sm:p-14 rounded-3xl text-center flex flex-col items-center">
            <div class="glare" id="card-glare"></div>
            
            <div class="glitch-wrapper mb-6 w-full">
                <h1 class="text-4xl sm:text-5xl font-cyber font-black tracking-widest leading-tight glitch-text" data-text="WEBSITE MAINTENANCE">
                    WEBSITE<br><span class="text-neon-pink">MAINTENANCE</span>
                </h1>
            </div>

            <p class="content-3d text-sm sm:text-base opacity-80 mb-10 max-w-md font-light tracking-widest uppercase">
                Critical core structures are being re-aligned. Connection will be restored shortly.
            </p>

            <!-- Loading Bar -->
            <div class="content-3d w-full bg-gray-300/30 dark:bg-gray-800/50 rounded-full h-1.5 mb-10 overflow-hidden relative">
                <div class="absolute top-0 left-0 h-full w-1/3 bg-gradient-to-r from-transparent via-blue-500 to-neon-cyan dark:via-neon-pink dark:to-neon-cyan animate-[slide_1.5s_ease-in-out_infinite]"></div>
            </div>

            <!-- Action Button -->
            <button id="actionBtn" disabled class="btn-3d btn-cyber w-full py-4 px-6 rounded-xl font-cyber font-bold tracking-widest text-lg cursor-not-allowed bg-gray-400/20 dark:bg-black/40 text-gray-500 dark:text-gray-600 border border-transparent backdrop-blur-sm">
                <span id="btnContent" class="relative z-10 flex items-center justify-center gap-3">
                    <svg class="w-5 h-5 animate-spin opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                    SYSTEM LOCKED (<span id="timerText" class="text-blue-600 dark:text-neon-pink inline-block w-4 text-center">5</span>s)
                </span>
            </button>
        </div>
    </div>

    <!-- Success Overlay -->
    <div id="success-overlay" class="absolute inset-0 z-50 flex items-center justify-center bg-white/80 dark:bg-black/90">
        <div class="text-center transform transition-transform duration-700 scale-50 opacity-0" id="success-content">
            <div class="relative inline-flex items-center justify-center w-32 h-32 mb-8">
                <!-- Outer glowing rings -->
                <div class="absolute inset-0 rounded-full border-4 border-t-neon-cyan border-r-neon-pink border-b-transparent border-l-transparent animate-spin"></div>
                <div class="absolute inset-2 rounded-full border-4 border-b-neon-cyan border-l-neon-pink border-t-transparent border-r-transparent animate-[spin_1.5s_linear_infinite_reverse]"></div>
                <!-- Checkmark -->
                <div class="bg-green-500/20 rounded-full p-4 shadow-[0_0_50px_rgba(0,255,0,0.4)]">
                    <svg class="w-12 h-12 text-green-400 drop-shadow-[0_0_10px_rgba(0,255,0,0.8)]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>
                </div>
            </div>
            <h2 class="text-4xl sm:text-5xl font-cyber font-bold text-gray-800 dark:text-white mb-3 tracking-wider drop-shadow-[0_0_10px_rgba(255,255,255,0.3)]">CONNECTION SECURED</h2>
            <p class="text-lg text-gray-600 dark:text-neon-cyan/80 font-mono tracking-widest">ESTABLISHING UPLINK...</p>
        </div>
    </div>

    <style>
        @keyframes slide {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(300%); }
        }
    </style>

    <script>
        // --- 1. WEB AUDIO API SYNTHESIZER ---
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx;

        function initAudio() {
            if (!audioCtx) audioCtx = new AudioContext();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        // Initialize audio on first user interaction to bypass autoplay restrictions
        ['click', 'keydown', 'mousemove', 'touchstart'].forEach(evt => {
            document.addEventListener(evt, initAudio, { once: true });
        });

        function playSound(type) {
            if (!audioCtx) return;
            
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            const now = audioCtx.currentTime;

            if (type === 'theme') {
                // Soft hi-tech blip
                osc.type = 'sine';
                osc.frequency.setValueAtTime(600, now);
                osc.frequency.exponentialRampToValueAtTime(300, now + 0.1);
                gainNode.gain.setValueAtTime(0.1, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now);
                osc.stop(now + 0.1);
            } 
            else if (type === 'ready') {
                // Cyberpunk notification chime (two rapid high notes)
                osc.type = 'square';
                osc.frequency.setValueAtTime(1046.50, now); // C6
                gainNode.gain.setValueAtTime(0.1, now);
                gainNode.gain.setValueAtTime(0, now + 0.1);
                
                osc.frequency.setValueAtTime(1318.51, now + 0.15); // E6
                gainNode.gain.setValueAtTime(0.1, now + 0.15);
                gainNode.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
                
                // Add lowpass filter for electronic feel
                const filter = audioCtx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.value = 2000;
                osc.disconnect();
                osc.connect(filter);
                filter.connect(gainNode);

                osc.start(now);
                osc.stop(now + 0.5);
            } 
            else if (type === 'warp') {
                // Sci-fi warp/activation sound
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(100, now);
                osc.frequency.exponentialRampToValueAtTime(800, now + 0.4);
                
                const filter = audioCtx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(200, now);
                filter.frequency.exponentialRampToValueAtTime(4000, now + 0.4);
                filter.Q.value = 10; // High resonance
                
                osc.disconnect();
                osc.connect(filter);
                filter.connect(gainNode);
                
                gainNode.gain.setValueAtTime(0.2, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.6);
                
                osc.start(now);
                osc.stop(now + 0.6);
            }
        }

        // --- 2. HTML5 CANVAS PARTICLE NETWORK ---
        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        let mouse = { x: null, y: null, radius: 150 };

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        window.addEventListener('mousemove', (e) => {
            mouse.x = e.x;
            mouse.y = e.y;
        });
        window.addEventListener('mouseout', () => {
            mouse.x = null;
            mouse.y = null;
        });

        class Particle {
            constructor(x, y, dx, dy, size) {
                this.x = x;
                this.y = y;
                this.dx = dx;
                this.dy = dy;
                this.size = size;
                this.baseX = this.x;
                this.baseY = this.y;
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2, false);
                const isDark = document.documentElement.classList.contains('dark');
                ctx.fillStyle = isDark ? '#00f3ff' : '#0b3954';
                ctx.fill();
            }
            update() {
                if (this.x > canvas.width || this.x < 0) this.dx = -this.dx;
                if (this.y > canvas.height || this.y < 0) this.dy = -this.dy;

                // Mouse interaction - subtle repulsion
                if (mouse.x != null && mouse.y != null) {
                    let dx = mouse.x - this.x;
                    let dy = mouse.y - this.y;
                    let distance = Math.sqrt(dx * dx + dy * dy);
                    if (distance < mouse.radius) {
                        const forceDirectionX = dx / distance;
                        const forceDirectionY = dy / distance;
                        const force = (mouse.radius - distance) / mouse.radius;
                        this.x -= forceDirectionX * force * 2;
                        this.y -= forceDirectionY * force * 2;
                    }
                }

                this.x += this.dx;
                this.y += this.dy;
                this.draw();
            }
        }

        function initParticles() {
            particles = [];
            let numberOfParticles = (canvas.width * canvas.height) / 10000; // Density
            for (let i = 0; i < numberOfParticles; i++) {
                let size = (Math.random() * 2) + 1;
                let x = Math.random() * (canvas.width - size * 2) + size * 2;
                let y = Math.random() * (canvas.height - size * 2) + size * 2;
                let dx = (Math.random() - 0.5) * 1.5;
                let dy = (Math.random() - 0.5) * 1.5;
                particles.push(new Particle(x, y, dx, dy, size));
            }
        }

        function connectParticles() {
            let opacityValue = 1;
            const isDark = document.documentElement.classList.contains('dark');
            const colorRgb = isDark ? '0, 243, 255' : '11, 57, 84';

            for (let a = 0; a < particles.length; a++) {
                for (let b = a; b < particles.length; b++) {
                    let distance = ((particles[a].x - particles[b].x) * (particles[a].x - particles[b].x))
                                 + ((particles[a].y - particles[b].y) * (particles[a].y - particles[b].y));
                    
                    if (distance < (canvas.width / 7) * (canvas.height / 7)) {
                        opacityValue = 1 - (distance / 15000);
                        ctx.strokeStyle = `rgba(${colorRgb}, ${opacityValue})`;
                        ctx.lineWidth = 1;
                        ctx.beginPath();
                        ctx.moveTo(particles[a].x, particles[a].y);
                        ctx.lineTo(particles[b].x, particles[b].y);
                        ctx.stroke();
                    }
                }
            }
        }

        function animateCanvas() {
            requestAnimationFrame(animateCanvas);
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < particles.length; i++) {
                particles[i].update();
            }
            connectParticles();
        }
        
        initParticles();
        animateCanvas();


        // --- 3. 3D TILT EFFECT LOGIC ---
        const card = document.getElementById('tilt-card');
        const glare = document.getElementById('card-glare');
        const container = document.querySelector('.tilt-container');

        container.addEventListener('mousemove', (e) => {
            const rect = card.getBoundingClientRect();
            // Calculate mouse position relative to the center of the card
            const x = e.clientX - rect.left; 
            const y = e.clientY - rect.top;
            
            const centerX = rect.width / 2;
            const centerY = rect.height / 2;
            
            // Calculate rotation (max 15 degrees)
            const rotateX = ((y - centerY) / centerY) * -15;
            const rotateY = ((x - centerX) / centerX) * 15;

            card.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
            
            // Glare effect
            glare.style.opacity = '1';
            glare.style.background = `radial-gradient(circle at ${x}px ${y}px, rgba(255,255,255,0.2) 0%, transparent 60%)`;
        });

        container.addEventListener('mouseleave', () => {
            card.style.transform = `rotateX(0deg) rotateY(0deg)`;
            glare.style.opacity = '0';
        });


        // --- 4. COUNTDOWN & BUTTON LOGIC ---
        let timeLeft = 5;
        const actionBtn = document.getElementById('actionBtn');
        const timerText = document.getElementById('timerText');
        const btnContent = document.getElementById('btnContent');

        const countdown = setInterval(() => {
            timeLeft--;
            if (timeLeft > 0) {
                timerText.innerText = timeLeft;
            } else {
                clearInterval(countdown);
                
                // Enable Button
                actionBtn.disabled = false;
                actionBtn.classList.remove('cursor-not-allowed', 'bg-gray-400/20', 'dark:bg-black/40', 'text-gray-500', 'dark:text-gray-600', 'border-transparent');
                
                // Add Cyberpunk Active Styles
                actionBtn.classList.add('active', 'bg-black/50', 'dark:bg-black/80', 'text-white', 'cursor-pointer');
                
                // Change Content
                btnContent.innerHTML = `
                    <svg class="w-6 h-6 mr-2 text-neon-cyan" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                    REFRESH
                `;
                
                playSound('ready');
            }
        }, 1000);

        // Button Click Handler
        actionBtn.addEventListener('click', () => {
            playSound('warp');
            
            const overlay = document.getElementById('success-overlay');
            const content = document.getElementById('success-content');
            
            overlay.classList.add('show');
            
            // Trigger pop-in animation
            setTimeout(() => {
                content.classList.remove('scale-50', 'opacity-0');
                content.classList.add('scale-100', 'opacity-100');
            }, 50);

            // Reload page after sequence
            setTimeout(() => {
                window.location.reload();
            }, 3000);
        });


        // --- 5. THEME TOGGLE LOGIC ---
        const themeBtn = document.getElementById('theme-toggle');
        const sunIcon = document.getElementById('sun-icon');
        const moonIcon = document.getElementById('moon-icon');
        const htmlElement = document.documentElement;

        themeBtn.addEventListener('click', () => {
            playSound('theme');
            htmlElement.classList.toggle('dark');
            sunIcon.classList.toggle('hidden');
            moonIcon.classList.toggle('hidden');
        });
    </script>
</body>
</html>
